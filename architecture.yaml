# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture.schema.json
#
# The architecture policy: every boundary in this monorepo, as one manifest.
#
# It reads like a directory listing — a key ending in `/` is a folder, anything
# else is a file — and everything the architecture says about a part of the tree
# is written at that part of the tree: what it may import, who may import it,
# which names it may declare, and which siblings its files owe.
#
# Patterns are globs over repo-relative paths, matched against FULLY RESOLVED
# targets:
#
#   *          part of one path segment          {name}   captures one segment
#   **         any number of segments            [A-Z]    a character class
#   a/**       `a` itself as well as a/b/c       |        several patterns, one node
#
# Every glob is quoted: `*` opens a YAML alias, `@` and `` ` `` may not begin a
# bare word, and a quoted string is a string whatever it contains.
#
# The default is tight. A folder admits only the children it lists; a file may
# import only what it or an ancestor allows. Laxity is opted into by name:
# `reset` drops inherited allowances, `unrestricted` says a tier has no
# allowlist yet, `layout: open` says a folder does not enumerate its files.
#
# Every rule this compiles to carries a probe it must report, generated from the
# node's own path. The plugin refuses to load if any rule fails its own — a rule
# that has drifted into matching nothing is the failure this whole apparatus
# exists to prevent.
#
# This repository publishes the packages that read this file, so the policy is
# also their largest test: a change that breaks lowering breaks the lint run
# here first.

# Where a repository adopting this policy records the violations it is
# carrying. This one has none, so the file is absent — and `architecture
# baseline` would write an empty list rather than a place to hide.
baseline: .architecture-baseline.json

resolve:
  # Only `packages/` is policed. The docs site is Astro, whose `astro:*`
  # virtual modules resolve to nothing on disk, and a scope that cannot
  # resolve its own imports would report noise rather than architecture.
  scopes:
    - files: "^packages/"
      language: typescript
      options: { tsconfig: tsconfig.resolve.json }
  # An import nobody can resolve is an import no rule can police. Loud by
  # default; anything listed here needs a reason next to it.
  unresolved: error
  ignoreUnresolved: []

aliases:
  "~": packages
  "@core": packages/core/src
  "@ts": packages/typescript/src
  "@cli": packages/cli/src
  "@ox": packages/oxlint/src

# Which exported names may cross which edges — the family a path rule cannot
# express, because every importer of a module resolves to the same file.
exports:
  - name: live-adapters-at-the-composition-root
    message: "A live adapter is constructed once, where a host is composed. Everything else takes the port it satisfies, or the fake — which is what lets it be tested without a file system, a parser or a resolver."
    module:
      - "@core/infrastructure/file-system-live.ts"
      - "@core/index.ts"
      - "@ts/extractor.ts"
      - "@ts/resolver.ts"
      - "@ts/index.ts"
    symbols: [makeFileSystemLive, makeModuleResolverLive, makeFactExtractorLive]
    # The two hosts' composition roots; the barrels that re-export them; and
    # the pack, which is what assembles its own extractor and resolver.
    except:
      - "@cli/config-loader.ts"
      - "@ox/config-loader.ts"
      - "@core/index.ts"
      - "@ts/index.ts"
      - "**/*.test.ts"
    probe:
      source: 'import { makeFileSystemLive } from "./infrastructure/file-system-live.js";'
      symbol: makeFileSystemLive

  - name: language-packs-at-the-composition-root
    message: "A language pack is constructed where a host is composed, and handed down as the `Language` port. Nothing in between names TypeScript — which is what lets a second language be added without editing the core."
    module: "@ts/index.ts"
    symbols: [typescriptLanguage]
    except: ["@cli/config-loader.ts", "@ox/config-loader.ts", "**/*.test.ts"]
    probe:
      source: 'import { typescriptLanguage } from "@goodbones/typescript";'
      symbol: typescriptLanguage

  - name: name-what-you-take
    message: "Name what you take from a sibling module. A namespace import or an `export *` takes every export at once, hides which are used, and launders a restricted name past every rule about it."
    module: "~/*/src/**"
    kinds: [namespace]
    probe:
      source: 'import * as imports from "./core/imports.js";'
      symbol: "*"

# Ratchets on the policy itself. No tier here says "not tightened yet", and
# the ceilings say none may start to without this line changing. The floors
# are the reach `architecture coverage` reported when they were written.
limits:
  unrestricted: 0
  partial: 0
  # Every folder here is `layout: open`, so structure is 0% enumerated and
  # states no floor. The rest are the numbers on the day they were written:
  # 2026-09-05, after the manifest became this file — members is 29/84 (the
  # core's domain, ports, core and load tiers), surface 80/84 (every file
  # under a `src/`; the four `vitest.config.ts` are the remainder), graph
  # 50/84 (every non-test file under a `src/`).
  coverage: { imports: 1, members: 0.34, surface: 0.95, graph: 0.59 }

# The shape of the whole graph — evaluated by `architecture check`, which
# is the one adapter that sees every file at once.
graph:
  cycles:
    - name: no-cycles
      message: "These files import each other, directly or through others. A cycle is a module boundary that does not exist."
      within: "~/*/src/**"
      withinNot: "**/*.test.ts"

  orphans:
    - name: no-dead-modules
      message: "Nothing imports this file. A module nothing reaches is either dead, or an entry point this policy has not listed."
      within: "~/*/src/**"
      withinNot: "**/*.test.ts"
      entry:
        - "@core/index.ts"
        - "@core/testing.ts"
        - "@ts/index.ts"
        - "@cli/main.ts"
        - "@ox/plugin.ts"

  reach:
    - name: pure-tiers-reach-no-adapter
      message: "The pure tiers — domain, ports, core, manifest, load — reach no live implementation, no language pack and no host, through any number of hops. That is what makes them testable without one."
      from:
        - "@core/domain/**"
        - "@core/ports/**"
        - "@core/core/**"
        - "@core/manifest/**"
        - "@core/load/**"
      fromNot: "**/*.test.ts"
      to:
        - "@core/infrastructure/file-system-live.ts"
        - "@core/infrastructure/walk.ts"
        - "@core/infrastructure/manifest-file.ts"
        - "@ts/**"
        - "@cli/**"
        - "@ox/**"

    # The one line that proves the decoupling held: nothing in the core
    # reaches TypeScript, or either host, through any number of hops.
    - name: core-reaches-no-other-package
      message: "The core reaches no other package. A second language is a second pack that depends on the core; the core depends on none of them."
      from: "@core/**"
      fromNot: "**/*.test.ts"
      to: ["@ts/**", "@cli/**", "@ox/**"]

    - name: cli-never-reaches-the-plugin
      message: "The two hosts answer to the same core, never to each other — so an alpha plugin API is not a single point of failure for the CLI."
      from: "@cli/**"
      to: "@ox/**"

    - name: plugin-never-reaches-the-cli
      message: "The two hosts answer to the same core, never to each other — so the plugin carries nothing of the CLI's into a lint run."
      from: "@ox/**"
      to: "@cli/**"

# Fragments the tree below reuses, each by `use: <name>`. A key written beside
# `use` overrides the fragment's; a list is never merged, so a package that
# widens the floor spells the whole list out.
defs:
  # "Given facts, they return violations; they never read a file." Stated as a
  # rule about calls rather than about imports: an import allowlist stops
  # `node:fs` at the door, but a `readFileSync` handed in as a callback, or
  # reached through a helper, is the same violation with no edge to catch.
  no-file-system-calls:
    message: "`{name}` reads or writes the file system. This tier is given facts and returns violations; the file system is behind a port, and the port is what it takes."
    subject: calls
    match: ["*Sync", readFile, readdir, writeFile, require]
    probe:
      source: 'import { readFileSync } from "node:fs"; readFileSync("x");'
      name: readFileSync

  # The floor every package inherits: node builtins, the runtime, and the test
  # framework. Each package adds the packages it may reach; none of them `reset`,
  # so this floor cannot be dropped further down.
  package-floor:
    external: [effect, vitest]
    allow: ["node:**", vitest.shared.ts]

  # No default exports. A default has no name to grep for, and every importer may
  # call it something different. The oxlint plugin entry is the one exception:
  # oxlint reads a plugin as a module's default.
  no-default-exports:
    message: "No default exports. A default has no name to grep for, and every importer may call it something different."
    kinds: [default]
    probe:
      source: "export default function main() {}"

  named-reexports-only:
    message: "Re-export by name, so a barrel says what the module is. `export *` takes every export at once and launders a restricted name through the barrel."
    kinds: [namespace]

# A package boundary is its barrel. Another package is reached by its published
# name, which resolves to `index.ts` (or `testing.ts`); a deep import into a
# sibling's `src/` is refused, as it would be for a consumer outside the repo.
tree:
  "~/core/":
    message: "@goodbones/core is a hexagon: a pure domain and core, ports for the things a language must provide, a fake per port, and the loader that turns a manifest into a policy. It names no language and no host."
    layout: open
    imports:
      use: package-floor
      message: "This import is not on this package's allowlist."
      # The floor, and the YAML parser the manifest reader needs. `ajv` checks
      # the published JSON Schema in one test.
      external: [effect, vitest, yaml, ajv]
    children:
      "src/":
        layout: open
        surface:
          - use: no-default-exports
          - use: named-reexports-only
        children:
          "domain/":
            message: "domain/ is the model: the manifest schema, the error types, and the Violation with its line-independent fingerprint. No I/O, and nothing above it."
            layout: open
            children: {}
            members:
              - use: no-file-system-calls
            imports:
              message: "domain/ is the bottom of the graph. It reaches itself and the runtime, and nothing else in the package."
              allow: ["@core/domain/**"]

          "ports/":
            message: "ports/ declares the things a policy must be given — a file system, a module resolver, a parser, a language — as interfaces, so the core can be tested without any of them."
            layout: open
            children: {}
            members:
              - message: 'A port member is a verb in camelCase: "{name}" is not. The port is the vocabulary every adapter must speak, and its case is part of the contract.'
                subject: members
                declares: [type, interface]
                allow: "[a-z]*"
                probe:
                  source: "export type FileSystem = { readonly Exists: (path: string) => boolean };"
                  name: Exists
            imports:
              message: "A port is a declaration. It may name the domain types that appear in its signatures, and nothing else."
              allow: ["@core/domain/**", "@core/ports/**"]

          "core/":
            message: "core/ holds the pure evaluators — imports, exports, members, surface, structure, graph, coverage, baseline, patterns. Given facts, they return violations; they never read a file."
            layout: open
            children: {}
            members:
              - use: no-file-system-calls
            imports:
              message: "core/ evaluates. It reaches the domain, the ports it is given, and its own siblings — never a live adapter, which is what lets every rule here be tested against a fake."
              allow:
                - "@core/domain/**"
                - "@core/ports/**"
                - "@core/core/**"
                # A core test drives the fakes, which is the whole point of
                # the ports. The pattern names the fakes specifically, so a
                # test reaching a *live* adapter is still refused.
                - "@core/infrastructure/*-fake.ts"

          "manifest/":
            message: "manifest/ compiles the authored manifest tree down to the flat, resolved rules the core evaluates, expands the fragments it reuses, and generates each rule's probe while it does."
            layout: open
            children: {}
            imports:
              message: "Lowering is a transformation of the domain types. It reaches the domain and its own siblings; it does not evaluate, and it does not resolve."
              allow: ["@core/domain/**", "@core/manifest/**"]

          "load/":
            message: "load/ turns a manifest into a policy: decode, lower, compile, and probe every rule, with whatever language packs the host hands in. It composes the pure tiers and names no language and no live adapter."
            layout: open
            children: {}
            members:
              - use: no-file-system-calls
            imports:
              message: "load/ composes the pure tiers. It reaches the domain, the ports, the core, the manifest compiler and its own siblings; a live adapter or a language pack reaches it only as an argument."
              allow:
                - "@core/domain/**"
                - "@core/ports/**"
                - "@core/core/**"
                - "@core/manifest/**"
                - "@core/load/**"
                - "@core/infrastructure/*-fake.ts"

          "infrastructure/":
            message: "infrastructure/ holds a fake per port, and the three things the core does on this host without a language: the live file system, the walker, and reading the manifest file. The language-specific adapters live in their packs."
            layout: open
            children: {}
            imports:
              message: "An adapter implements a port. It reaches the port it satisfies, the domain types in that signature, and its own siblings — and, in this package, no third-party code beyond the runtime and the YAML parser."
              allow: ["@core/domain/**", "@core/ports/**", "@core/infrastructure/**"]

          # The two barrels: the public surface, and the fakes.
          "*.ts":
            imports:
              message: "A barrel re-exports the package's surface, so it names every tier."
              allow: ["@core/**"]

      "**/": { layout: open, children: {} }

  "~/typescript/":
    message: "@goodbones/typescript implements the core's ports for one language: facts through the TypeScript parser, resolution through unrs-resolver, assembled into one Language. It depends on the core and on nothing else in the repository."
    layout: open
    imports:
      message: "The pack reaches the core's barrels, the compiler, the resolver, and its own siblings. It is the only package that may name TypeScript."
      # The floor, then this package's own.
      external: [effect, vitest, typescript, unrs-resolver]
      allow: ["node:**", vitest.shared.ts, "@core/index.ts", "@core/testing.ts", "@ts/**"]
    children:
      "src/":
        layout: open
        children: {}
        surface:
          - use: no-default-exports
          - use: named-reexports-only
      "**/": { layout: open, children: {} }

  "~/cli/":
    message: "@goodbones/cli is one host: it reads the manifest file, constructs the language packs, and evaluates every family — including the graph family, which only an adapter seeing every file at once can — with no linter in the loop."
    layout: open
    imports:
      message: "A host composes the package. It reaches the core's barrels and the language pack's, and its own siblings — never the other host."
      # The floor, then this package's own.
      external: [effect, vitest]
      allow:
        - "node:**"
        - vitest.shared.ts
        - "@core/index.ts"
        - "@core/testing.ts"
        - "@ts/index.ts"
        - "@cli/**"
    children:
      "src/":
        layout: open
        children: {}
        surface:
          - use: no-default-exports
          - use: named-reexports-only
      "**/": { layout: open, children: {} }

  "~/oxlint/":
    message: "@goodbones/oxlint is the other host: five oxlint rules over the same manifest, evaluated one file at a time in the editor and in CI. It answers to the core, never to the CLI."
    layout: open
    imports:
      message: "A host composes the package. It reaches the core's barrels and the language pack's, the linter, and its own siblings — never the other host."
      # The floor, then this package's own.
      external: [effect, vitest, oxlint]
      allow:
        - "node:**"
        - vitest.shared.ts
        - "@core/index.ts"
        - "@core/testing.ts"
        - "@ts/index.ts"
        - "@ox/**"
    children:
      # The plugin entry is the one default export: oxlint reads a plugin
      # as a module's default. Everything else has a name to grep for.
      "src/":
        layout: open
        children: {}
        surface:
          - use: no-default-exports
            except: ["@ox/plugin.ts"]
          - use: named-reexports-only
      "**/": { layout: open, children: {} }
