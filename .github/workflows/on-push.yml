name: NX release

on:
  push:
    branches:
      - main
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v5

      - name: Lint affected projects
        run: pnpm exec nx affected -t lint --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sets the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@v5

      - name: Test affected projects
        run: pnpm exec nx affected -t test --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck affected projects
        run: pnpm exec nx affected -t check --base=origin/main --head=${{ github.event.pull_request.head.sha || github.sha }}

  release:
    needs: [lint, test, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Checkout the main branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A package that has never been through First Publish is `private: true`.
      # `nx release` only excludes private packages when `release.projects` is
      # left to its default, and nx.json sets it to `packages/*` — so left alone,
      # the first `feat:` commit touching a private package would tag it, cut a
      # GitHub release for it, and hand publish.yml a package npm refuses. Nothing
      # is released until at least one package has been made public on purpose.
      - name: Find packages that are public
        id: publishable
        run: |
          public=$(node -e '
            const fs = require("fs");
            const names = fs.readdirSync("packages")
              .map((d) => `packages/${d}/package.json`)
              .filter((f) => fs.existsSync(f))
              .map((f) => JSON.parse(fs.readFileSync(f, "utf8")))
              .filter((p) => p.private !== true)
              .map((p) => p.name);
            console.log(names.join(" "));
          ')
          echo "packages=${public}" >> "$GITHUB_OUTPUT"
          if [ -z "$public" ]; then
            echo "Every package under packages/ is private; nothing to release."
          else
            echo "Public packages: $public"
          fi

      - name: Build all packages for release
        if: steps.publishable.outputs.packages != ''
        run: pnpm exec nx run-many -t build --projects='packages/*'

      - name: Run nx release
        if: steps.publishable.outputs.packages != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          npx nx release --skip-publish
